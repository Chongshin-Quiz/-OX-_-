<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>개혁주의 인간론 OX 132제</title>
<style>
:root{--bg:#07111f;--panel:#0f1b2e;--panel2:#16253c;--text:#f7f9fd;--muted:#9caec6;--line:#2a3d5e;--blue:#4b8cff;--green:#2ed17f;--red:#ff6b76;--yellow:#ffd166}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:linear-gradient(180deg,#06101d,#0d1728 55%,#091220);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}.wrap{width:min(960px,calc(100% - 24px));margin:auto;padding:24px 0 70px}.badge{display:inline-block;border:1px solid #315f9d;background:#102a50;color:#c8ddff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:900}h1{font-size:clamp(31px,6vw,52px);line-height:1.07;margin:16px 0 10px}.lead{color:var(--muted);line-height:1.65;margin:0}.card{margin-top:18px;background:rgba(15,27,46,.97);border:1px solid var(--line);border-radius:24px;padding:21px;box-shadow:0 22px 70px rgba(0,0,0,.3)}h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.scope{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:14px;padding:13px 8px;font-weight:900}.scope.active{background:#244a86;border-color:#5594ff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}select,.ghost{width:100%;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:#fff;font:inherit}.primary{width:100%;border:0;border-radius:16px;background:var(--blue);color:#fff;padding:16px 18px;font-size:16px;font-weight:1000;margin-top:14px}.hidden{display:none!important}.quizhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.livebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.liveitem{background:#0b1627;border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center;color:var(--muted);font-size:12px;font-weight:800}.liveitem b{display:block;margin-top:3px;color:#fff;font-size:18px}.liveitem.good b{color:#9df0c4}.liveitem.bad b{color:#ffadb4}.mini{color:var(--muted);font-size:13px}.progress{height:9px;background:#091322;border-radius:999px;overflow:hidden;margin-top:15px}.bar{height:100%;width:0;background:linear-gradient(90deg,#4b8cff,#80b1ff)}.qtext{font-size:clamp(22px,4.2vw,34px);font-weight:950;line-height:1.5;margin:27px 0}.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ox button{min-height:140px;border-radius:24px;border:2px solid var(--line);background:#101b2c;color:#fff;font-size:68px;font-weight:1000}.feedback{margin-top:16px;border-radius:17px;padding:15px 16px;line-height:1.65;font-weight:800}.correct{background:rgba(46,209,127,.11);border:1px solid rgba(46,209,127,.46);color:#b8f4d6}.wrong{background:rgba(255,107,118,.12);border:1px solid rgba(255,107,118,.48);color:#ffc2c7}.explain{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);color:#eef3fb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:16px;text-align:center}.stat b{font-size:29px;display:block}.wrongitem{border:1px solid var(--line);background:#101a2b;border-radius:15px;padding:14px;margin-top:10px;line-height:1.55}.note{margin-top:13px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0c1728;color:var(--muted);font-size:13px;line-height:1.5}footer{text-align:center;color:#71849f;font-size:12px;margin-top:24px}@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.ox button{min-height:112px;font-size:56px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.card{padding:17px}}
</style></head><body><div class="wrap"><header><span class="badge">최종 검수본 · 132제</span><h1>개혁주의 인간론<br>학자·주장 OX</h1><p class="lead">강의안과 1–6주차 교정본을 기준으로 만든 시험 대비 문제은행입니다. 학자 이름 바꿔치기와 주장·이론 매칭을 집중 훈련합니다.</p></header>
<section id="setup" class="card"><h2>범위 선택</h2><div class="grid"><button class="scope active" data-scope="all">전체 132</button><button class="scope" data-scope="1-2">1–2주차</button><button class="scope" data-scope="3">3주차</button><button class="scope" data-scope="4">4주차</button><button class="scope" data-scope="5">5주차</button><button class="scope" data-scope="6">6주차</button><button class="scope" data-scope="wrong">오답노트</button></div><div class="row"><select id="count"><option value="10">10문제</option><option value="20" selected>20문제</option><option value="30">30문제</option><option value="50">50문제</option><option value="all">범위 전체</option></select><select id="order"><option value="random" selected>랜덤 출제</option><option value="seq">번호 순서</option></select></div><div class="row"><select id="mode"><option value="study" selected>학습 모드 · 즉시 해설</option><option value="exam">실전 모드 · 결과에서 해설</option></select><button id="clear" class="ghost">오답노트 초기화</button></div><button id="start" class="primary">퀴즈 시작</button><div class="note"><b style="color:white">추천:</b> 4주차 범위 전체 → 전체 랜덤 50문제 → 오답노트 반복</div><div id="saved" class="mini" style="margin-top:10px"></div></section>
<section id="quiz" class="card hidden"><div class="quizhead"><div><div id="meta" class="mini"></div><strong id="counter"></strong></div><button id="quit" class="ghost" style="width:auto">나가기</button></div><div class="livebar"><div class="liveitem"><span>진행</span><b id="liveProgress">1 / 1</b></div><div class="liveitem good"><span>정답</span><b id="liveCorrect">0</b></div><div class="liveitem bad"><span>오답</span><b id="liveWrong">0</b></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="qtext" class="qtext"></div><div class="ox"><button data-a="O">O</button><button data-a="X">X</button></div><div id="feedback" class="feedback hidden"></div><button id="next" class="primary hidden">다음 문제</button></section>
<section id="result" class="card hidden"><span class="badge">RESULT</span><h2 style="font-size:32px;margin-top:14px">채점 결과</h2><div class="stats"><div class="stat"><b id="pct">0%</b>정답률</div><div class="stat"><b id="raw">0/0</b>정답</div><div class="stat"><b id="wr">0</b>오답</div></div><div class="row"><button id="retry" class="ghost">이번 오답 다시 풀기</button><button id="home" class="ghost">범위 다시 선택</button></div><div id="wronglist"></div></section><footer>개혁주의 인간론 1–6주차 · 시험 대비</footer></div>
<script>const QUESTIONS=[{"week": "1-2", "q": "Charles Hodge(찰스 하지)는 강의에서 인간론에 중요하거나 교수에게 영향을 준 개혁파 신학자 가운데 한 사람으로 제시된다.", "a": "O", "corr": "", "id": 1}, {"week": "1-2", "q": "Abraham Kuyper(아브라함 카이퍼)는 강의에서 인간론에 중요하거나 교수에게 영향을 준 개혁주의 신학자 가운데 한 사람으로 제시된다.", "a": "O", "corr": "", "id": 2}, {"week": "1-2", "q": "한국 장로교 인간론 전통에서 교수는 박형룡만 중요하게 보고 서철원과 최홍석은 중요하게 다루지 않았다.", "a": "X", "corr": "박형룡·서철원·최홍석 모두 한국 장로교 인간론 전통에서 중요하게 언급된다.", "id": 3}, {"week": "1-2", "q": "B. B. Warfield(B. B. 워필드)는 성경의 족보를 통해 인간이 존재한 정확한 연대를 계산하는 것이 성경의 중심 관심이라고 보았다.", "a": "X", "corr": "강의에서는 정확한 연대 계산이 성경의 중심 관심이 아니라는 방향과 연결된다.", "id": 4}, {"week": "1-2", "q": "B. B. Warfield(B. B. 워필드)는 인간이 정확히 얼마나 오래전부터 존재했는지가 성경의 중심 관심은 아니라고 보는 입장과 연결된다.", "a": "O", "corr": "", "id": 5}, {"week": "1-2", "q": "Walter Brueggemann(월터 브루그만)과 Claus Westermann(클라우스 베스터만)은 모세 저작성과 창세기 초기 역사의 역사성 등에 관해 개혁주의와 다른 전제를 가진 학자들의 예로 언급된다.", "a": "O", "corr": "", "id": 6}, {"week": "1-2", "q": "Julius Wellhausen(율리우스 벨하우젠)은 창세기에 나타나는 하나님의 명칭 차이 등을 서로 다른 자료의 증거로 이해하는 문서가설과 연결된다.", "a": "O", "corr": "", "id": 7}, {"week": "1-2", "q": "Gerald Rau(제럴드 라우)는 인간의 기원에 관한 여러 입장을 비교하는 자료와 연결되어 수업에서 언급된다.", "a": "O", "corr": "", "id": 8}, {"week": "1-2", "q": "James K. Hoffmeier(제임스 K. 호프마이어)는 창세기 1–11장의 실제 사건성과 역사적 성격을 긍정하는 방향의 입장으로 소개된다.", "a": "O", "corr": "", "id": 9}, {"week": "1-2", "q": "Gordon Wenham(고든 웬함)은 창세기 1–11장을 Proto-History라는 개념과 연결하여 이해하는 입장으로 소개된다.", "a": "O", "corr": "", "id": 10}, {"week": "1-2", "q": "Kenton Sparks(켄턴 스파크스)는 창세기 1–11장을 Ancient Historiography의 관점에서 해석하는 입장과 연결된다.", "a": "O", "corr": "", "id": 11}, {"week": "1-2", "q": "Gordon Wenham(고든 웬함)은 에덴동산·홍수·바벨탑이 실제 역사와 아무 관련도 없다고 주장한 학자로 소개된다.", "a": "X", "corr": "Gordon Wenham은 Proto-History와 연결된다.", "id": 12}, {"week": "1-2", "q": "Ligon Duncan III(리곤 던컨 3세)와 David Hall(데이비드 홀)은 창조의 날을 24시간으로 보는 입장과 연결된다.", "a": "O", "corr": "", "id": 13}, {"week": "1-2", "q": "Hugh Ross(휴 로스)와 Gleason Archer(글리슨 아처)는 Day-Age View와 연결된다.", "a": "O", "corr": "", "id": 14}, {"week": "1-2", "q": "Lee Irons(리 아이언스)와 Meredith G. Kline(메러디스 클라인)은 Framework View와 연결된다.", "a": "O", "corr": "", "id": 15}, {"week": "1-2", "q": "Meredith G. Kline(메러디스 클라인)은 Day-Age View의 대표자로 소개된다.", "a": "X", "corr": "Meredith G. Kline은 Framework View와 연결된다.", "id": 16}, {"week": "1-2", "q": "Gijsbert van den Brink(기스베르트 판 덴 브링크)는 현대 과학의 주류적 설명을 받아들여 인간의 기원과 죄의 기원 등을 재구성하는 유신진화론적 인간론의 중요한 검토 대상으로 다뤄진다.", "a": "O", "corr": "", "id": 17}, {"week": "1-2", "q": "James K. A. Smith(제임스 K. A. 스미스)는 유신진화론의 영향을 받아 인간의 기원과 죄의 기원을 전통적인 방식과 다르게 설명하는 영향력 있는 신학자의 예로 언급된다.", "a": "O", "corr": "", "id": 18}, {"week": "1-2", "q": "N. T. Wright(N. T. 라이트)는 1주차에서도 유신진화론의 영향을 받은 신학자의 예로 언급된다.", "a": "O", "corr": "", "id": 19}, {"week": "1-2", "q": "Richard Dawkins(리처드 도킨스)와 Daniel Dennett(대니얼 데닛)은 무신론적 진화론자의 예로 언급된다.", "a": "O", "corr": "", "id": 20}, {"week": "1-2", "q": "Richard Dawkins(리처드 도킨스)는 강의에서 개혁주의적 유신진화론자로 분류된다.", "a": "X", "corr": "Richard Dawkins는 무신론적 진화론자의 예로 언급된다.", "id": 21}, {"week": "1-2", "q": "Abraham Kuyper(아브라함 카이퍼)와 Herman Bavinck(헤르만 바빙크)는 19세기에도 이미 과학주의(scientism)에 대한 비판과 연결되는 인물들로 언급된다.", "a": "O", "corr": "", "id": 22}, {"week": "1-2", "q": "Herman Bavinck(헤르만 바빙크)는 인간과 동물 사이의 유사성을 전혀 인정하지 않았다고 설명된다.", "a": "X", "corr": "바빙크는 유사성을 인정하면서도 인간의 독특성을 강조한다.", "id": 23}, {"week": "1-2", "q": "Herman Bavinck(헤르만 바빙크)에게 인간의 언어는 인간과 동물을 가르는 “건널 수 없는 루비콘강”과 같은 구별로 설명된다.", "a": "O", "corr": "", "id": 24}, {"week": "1-2", "q": "인간과 동물 사이에 언어라는 “건널 수 없는 루비콘강”이 있다고 설명한 인물은 Herman Dooyeweerd(헤르만 도예베르트)이다.", "a": "X", "corr": "이 표현은 Herman Bavinck(헤르만 바빙크)와 연결된다.", "id": 25}, {"week": "1-2", "q": "Herman Bavinck(헤르만 바빙크)는 인간과 동물 사이의 언어적 차이를 중요한 인간의 독특성으로 본다.", "a": "O", "corr": "", "id": 26}, {"week": "3", "q": "Karl Rahner(칼 라너)는 ‘익명의 그리스도인(Anonymous Christian)’ 개념과 연결된다.", "a": "O", "corr": "", "id": 27}, {"week": "3", "q": "‘익명의 그리스도인’은 John Hick(존 힉)의 대표적 주장이다.", "a": "X", "corr": "‘익명의 그리스도인’은 Karl Rahner(칼 라너)와 연결된다.", "id": 28}, {"week": "3", "q": "John Hick(존 힉)은 종교다원주의와 연결되는 인물로 소개된다.", "a": "O", "corr": "", "id": 29}, {"week": "3", "q": "로마 가톨릭의 역사적 신학 문맥에서 Thomas Aquinas(토마스 아퀴나스)는 The Theologian이라고 불리는 인물과 연결된다.", "a": "O", "corr": "", "id": 30}, {"week": "3", "q": "같은 문맥에서 Aristotle(아리스토텔레스)는 The Philosopher와 연결된다.", "a": "O", "corr": "", "id": 31}, {"week": "3", "q": "bāśār – sōma – corpus – body의 대응은 강의에서 제시된 기본 원어 매칭에 맞는다.", "a": "O", "corr": "", "id": 32}, {"week": "3", "q": "bāśār – psychē – corpus – body의 대응은 옳다.", "a": "X", "corr": "bāśār의 헬라어 대응은 sōma이다.", "id": 33}, {"week": "3", "q": "nephesh – psychē – anima – soul의 대응은 옳다.", "a": "O", "corr": "", "id": 34}, {"week": "3", "q": "nephesh – pneuma – anima – soul의 대응은 옳다.", "a": "X", "corr": "nephesh의 헬라어 대응은 psychē이다.", "id": 35}, {"week": "3", "q": "rûaḥ – pneuma – spiritus – spirit의 대응은 옳다.", "a": "O", "corr": "", "id": 36}, {"week": "3", "q": "rûaḥ – psychē – spiritus – spirit의 대응은 옳다.", "a": "X", "corr": "rûaḥ의 헬라어 대응은 pneuma이다.", "id": 37}, {"week": "3", "q": "Herman Dooyeweerd(헤르만 도예베르트)는 그리스적 영육이원론과 스콜라주의적 인간 이해를 극복하려 했던 법학자·철학자로 소개된다.", "a": "O", "corr": "", "id": 38}, {"week": "3", "q": "죽음 이후 “영혼만의 기능이 남는가?”라는 질문에 nothing이라고 답한 인물로 Herman Dooyeweerd(헤르만 도예베르트)가 언급된다.", "a": "O", "corr": "", "id": 39}, {"week": "3", "q": "중간상태 문제에서 nothing이라고 답한 인물은 Herman Bavinck(헤르만 바빙크)이다.", "a": "X", "corr": "nothing이라는 답변은 Herman Dooyeweerd(헤르만 도예베르트)와 연결된다.", "id": 40}, {"week": "3", "q": "Herman Bavinck(헤르만 바빙크)는 영혼과 육체의 연합을 본성적 연합으로 설명하는 입장과 연결된다.", "a": "O", "corr": "", "id": 41}, {"week": "3", "q": "Herman Bavinck(헤르만 바빙크)는 영혼과 육체의 관계를 단지 외적이고 윤리적인 결합으로 이해한다.", "a": "X", "corr": "바빙크는 영혼과 육체의 연합을 본성적 연합으로 설명한다.", "id": 42}, {"week": "3", "q": "Karl Barth(칼 바르트)는 하나님의 형상을 ‘나와 너’, 특히 남자와 여자의 관계성과 강하게 연결하는 현대 형상론과 관련된다.", "a": "O", "corr": "", "id": 43}, {"week": "3", "q": "Karl Barth(칼 바르트)의 관계성 강조 자체는 완전히 잘못된 것으로 교수에게 평가된다.", "a": "X", "corr": "관계성 자체보다 그것을 형상 전체처럼 과도하게 강조하는 편파성이 문제이다.", "id": 44}, {"week": "3", "q": "교수는 Karl Barth(칼 바르트)의 관계성 자체보다 그것 y(q);fb.innerHTML=ok?`정답입니다. <strong>${q.a}</strong><div class="explain"><b style="color:#ffd166">해설</b><br>${esc(explanation)}</div>`:`오답입니다. 정답은 <strong>${q.a}</strong>입니다.<div class="explain"><b style="color:#ffd166">해설</b><br>${esc(explanation)}</div>`}$('#next').classList.remove('hidden')});$('#next').onclick=()=>{if(idx<active.length-1){idx++;render()}else finish()};function finish(){const s=stats();s.sessions=(s.sessions||0)+1;s.correct=(s.correct||0)+score;s.total=(s.total||0)+active.length;localStorage.setItem('anthro132Stats',JSON.stringify(s));$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#pct').textContent=`${Math.round(score/active.length*100)}%`;$('#raw').textContent=`${score}/${active.length}`;$('#wr').textContent=sessionWrong.length;const box=$('#wronglist');box.innerHTML='';if(sessionWrong.length){const h=document.createElement('h3');h.textContent='이번 오답';box.appendChild(h);sessionWrong.forEach(q=>{const d=document.createElement('div');d.className='wrongitem';d.innerHTML=`<small>${q.week}주차 · ${q.id}번</small><br>${esc(q.q)}<br><b>내 답 ${q.userAnswer} / 정답 ${q.a}</b><br><span style="color:#ffd166;font-weight:900">해설</span> ${esc(why(q))}`;box.appendChild(d)})}else{const d=document.createElement('div');d.className='wrongitem';d.textContent='이번 범위는 전부 맞았습니다.';box.appendChild(d)}saved()}function home(){$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#setup').classList.remove('hidden');saved()}$('#home').onclick=home;$('#quit').onclick=()=>{if(confirm('퀴즈를 종료할까요?'))home()};$('#retry').onclick=()=>{if(!sessionWrong.length){alert('이번 세션 오답이 없습니다.');return}start(sessionWrong)};</script></body></html>
